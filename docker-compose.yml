# Combined stack: Kafka (Person 1) + Spark NER (Person 2) + ELK (Person 3)
#
# Full pipeline (Codespace / 16 GB machine):
#   docker compose up -d --build
#
# Low-memory laptop (no Spark):
#   docker compose up -d kafka elasticsearch logstash kibana
#
# Stop everything:  docker compose down
#
# Kafka         -> localhost:9092 (from your computer) / kafka:29092 (inside Docker)
# Elasticsearch -> http://localhost:9200
# Kibana        -> http://localhost:5601

services:
  # ---- Person 1: Kafka ----
  kafka:
    image: apache/kafka:4.1.2
    container_name: hn-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # INTERNAL = other containers (Spark, Logstash); EXTERNAL = scripts on your computer
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      # Keep memory low so it fits on smaller machines
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    mem_limit: 600m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---- Person 2: Spark Structured Streaming + spaCy NER ----
  spark:
    build: ./spark
    container_name: spark-ner
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./spark:/app
      - spark_checkpoints:/checkpoints
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  # ---- Person 3: Elasticsearch, Logstash, Kibana ----
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 1300m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=512
    mem_limit: 800m
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: logstash
    environment:
      - XPACK_MONITORING_ENABLED=false
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - PIPELINE_WORKERS=1
    mem_limit: 600m
    volumes:
      - ./config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch:
        condition: service_started
      kafka:
        condition: service_healthy

volumes:
  spark_checkpoints:
  esdata:
