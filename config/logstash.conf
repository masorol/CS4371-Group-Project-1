# Reads cumulative entity counts from Kafka topic2 (written by the Spark NER job)
# and stores them in Elasticsearch index "entity-counts".
#
# Expected message format from Person 2 (confirm field names!):
#   {"entity": "OpenAI", "count": 42}

input {
  kafka {
    # Kafka container from docker-compose.yml (Docker-internal listener)
    bootstrap_servers => "kafka:29092"
    topics => ["topic2"]
    group_id => "logstash-entity-counts"
    auto_offset_reset => "earliest"
    codec => "json"
  }
}

filter {
  # Skip broken messages (no entity field) so they don't create a junk document
  if ![entity] {
    drop { }
  }

  # Make sure count is stored as a number so Kibana can sort/sum it
  mutate {
    convert => { "count" => "integer" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "entity-counts"
    # One document per entity: a new count REPLACES the old one (not summed)
    document_id => "%{entity}"
  }

  # Prints every message to the logstash log for debugging
  stdout { codec => rubydebug }
}
